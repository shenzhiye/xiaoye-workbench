<style>
:root{
  --olive:#5E7A3A; --olive-d:#3B6D11; --olive-dd:#27500A; --olive-l:rgba(234,243,222,0.5); --olive-ll:rgba(244,247,238,0.4);
  --ink:#2E3326; --muted:#6B7355; --line:rgba(217,223,200,0.5);
  --glass:rgba(255,255,255,0.55); --glass-strong:rgba(255,255,255,0.72); --glass-border:rgba(255,255,255,0.45);
  --danger:#B23A3A; --warn:#C98A2E;
  --shadow:0 2px 8px rgba(40,50,20,.06),0 1px 3px rgba(40,50,20,.04);
  --blur:saturate(1.3) blur(12px); --blur-strong:saturate(1.4) blur(20px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:linear-gradient(135deg,#DDE6CC 0%,#E8ECDF 40%,#D5DCC8 100%);
  background-attachment:fixed;min-height:100vh;position:relative;overflow-x:hidden;
}
/* 装饰性模糊圆 */
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(60px);z-index:-1;pointer-events:none}
body::before{width:280px;height:280px;background:rgba(94,122,58,0.18);top:-60px;right:-80px}
body::after{width:220px;height:220px;background:rgba(124,155,78,0.15);bottom:80px;left:-60px}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
/* 毛玻璃 Header */
.header{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:rgba(94,122,58,0.72);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  color:#fff;box-shadow:0 1px 12px rgba(59,109,17,.1);border-bottom:1px solid rgba(255,255,255,0.15)}
.header .menu-btn{width:38px;height:38px;border:none;background:rgba(255,255,255,0.12);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;backdrop-filter:blur(6px)}
.header .menu-btn:active{background:rgba(255,255,255,.22)}
.header h1{flex:1;font-size:17px;font-weight:600;margin:0;letter-spacing:.5px}
.header .icon-btn{width:38px;height:38px;border:none;background:rgba(255,255,255,0.12);color:#fff;font-size:18px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;backdrop-filter:blur(6px)}
.header .icon-btn:active{background:rgba(255,255,255,.22)}
/* 毛玻璃 Drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,28,10,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:264px;max-width:80vw;
  background:linear-gradient(165deg,rgba(43,80,10,0.5),rgba(94,122,58,0.42));backdrop-filter:var(--blur-strong);-webkit-backdrop-filter:var(--blur-strong);
  color:#fff;z-index:60;transform:translateX(-105%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,0.22);box-shadow:4px 0 28px rgba(20,30,10,0.12)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,0.08)}
.drawer-head .avatar{width:46px;height:46px;border-radius:14px;background:rgba(94,122,58,0.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin-bottom:8px;border:1px solid rgba(255,255,255,0.15)}
.drawer-head .name{font-size:16px;font-weight:600}
.drawer-head .sub{font-size:11.5px;opacity:.7;margin-top:2px}
.drawer nav{flex:1;padding:8px 0;overflow-y:auto}
.drawer .nav-item{display:flex;align-items:center;gap:12px;padding:13px 18px;font-size:14.5px;cursor:pointer;border-left:3px solid transparent;transition:background .15s}
.drawer .nav-item:active{background:rgba(255,255,255,.07)}
.drawer .nav-item.active{background:rgba(255,255,255,.12);border-left-color:#C0DD97;font-weight:600}
.drawer .nav-item .ic{font-size:17px;width:22px;text-align:center}
.drawer .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 18px}
.drawer .foot{padding:12px 18px;font-size:11px;opacity:.5}
.main{padding:12px 12px 28px}
.page{display:none;animation:fade .2s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 毛玻璃卡片 */
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;border:1px solid var(--glass-border)}
.card h3{margin:0 0 8px;font-size:14.5px;font-weight:600;color:var(--olive-dd)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 8px}
.sec-title h2{font-size:14px;font-weight:600;color:var(--olive-dd);margin:0}
.sec-title .hint{font-size:11.5px;color:var(--muted)}
/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:rgba(94,122,58,0.85);color:#fff;backdrop-filter:blur(6px)}
.btn-primary:active{filter:brightness(.93)}
.btn-ghost{background:rgba(234,243,222,0.6);color:var(--olive-dd);backdrop-filter:blur(6px)}
.btn-line{background:rgba(255,255,255,0.5);color:var(--olive-d);border:1px solid var(--glass-border);backdrop-filter:blur(6px)}
.btn-danger{background:rgba(255,255,255,0.5);color:var(--danger);border:1px solid rgba(178,58,58,0.2);backdrop-filter:blur(6px)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
/* 输入框 - 毛玻璃 */
input,textarea,select{width:100%;border:1px solid var(--glass-border);border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit;background:rgba(255,255,255,0.45);backdrop-filter:blur(6px);color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(94,122,58,.12);background:rgba(255,255,255,0.6)}
label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin:8px 0 4px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.tag{display:inline-block;background:rgba(234,243,222,0.5);color:var(--olive-dd);border-radius:6px;padding:2px 7px;font-size:11px;margin:2px 4px 2px 0;font-weight:600;backdrop-filter:blur(4px)}
.progress{height:8px;background:rgba(244,247,238,0.4);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),#7C9B4E);border-radius:6px;transition:width .3s}
/* 勾选框 */
.checkbox{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:#fff;font-size:13px;background:rgba(255,255,255,0.4);backdrop-filter:blur(4px);transition:all .15s}
.checkbox.on{background:var(--olive);border-color:var(--olive)}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(217,223,200,0.3)}
.task:last-child{border-bottom:none}
.task .txt{flex:1;font-size:13.5px}
.task.done .txt{color:var(--muted);text-decoration:line-through;opacity:.5}
.task .del{color:var(--muted);font-size:16px;cursor:pointer;width:24px;text-align:center;opacity:.6}
.badge{display:inline-flex;align-items:center;gap:4px;background:rgba(234,243,222,0.5);color:var(--olive-dd);border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:600;backdrop-filter:blur(4px)}
.badge.warn{background:rgba(251,243,230,0.6);color:var(--warn)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:13px}
.empty .big{font-size:34px;margin-bottom:6px;opacity:.4}
.platform-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.platform-btns .btn{flex:1;min-width:0;padding:8px 6px;font-size:12px}
.p-douyin{background:rgba(255,255,255,0.5);color:#1a1a1a;border:1px solid rgba(238,238,238,0.6);backdrop-filter:blur(6px)}
.p-bili{background:rgba(255,255,255,0.5);color:#00A1D6;border:1px solid rgba(214,237,246,0.6);backdrop-filter:blur(6px)}
.p-xhs{background:rgba(255,255,255,0.5);color:#FF2442;border:1px solid rgba(251,221,226,0.6);backdrop-filter:blur(6px)}
.p-zhihu{background:rgba(255,255,255,0.5);color:#0066FF;border:1px solid rgba(214,228,255,0.6);backdrop-filter:blur(6px)}
.mini{font-size:11.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed rgba(217,223,200,0.4)}
.kv:last-child{border-bottom:none}
.kv .v{font-weight:600;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:rgba(40,46,28,0.88);backdrop-filter:blur(12px);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:80vw;text-align:center;border:1px solid rgba(255,255,255,0.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 毛玻璃底部弹窗 */
.sheet{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,0.85);backdrop-filter:var(--blur-strong);-webkit-backdrop-filter:var(--blur-strong);border-radius:18px 18px 0 0;z-index:70;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s;max-width:480px;margin:0 auto;border-top:1px solid var(--glass-border)}
.sheet.open{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(217,223,200,0.3);position:sticky;top:0;background:rgba(255,255,255,0.6);backdrop-filter:blur(12px);border-radius:18px 18px 0 0}
.sheet-head h3{margin:0;font-size:15px}
.sheet-body{padding:16px}
.note{background:rgba(234,243,222,0.4);border-left:3px solid var(--olive);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--olive-dd);margin:8px 0;backdrop-filter:blur(4px)}
.fab{position:fixed;right:16px;bottom:24px;width:52px;height:52px;border-radius:50%;background:rgba(94,122,58,0.85);backdrop-filter:blur(8px);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(59,109,17,.3);cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.15)}
@media(min-width:520px){.fab{right:calc(50% - 240px + 16px)}}
/* 平台标签 */
.plat-tag{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
.plat-douyin{background:rgba(0,0,0,0.7);color:#fff}
.plat-bili{background:rgba(251,114,153,0.85);color:#fff}
.plat-xhs{background:rgba(255,36,66,0.85);color:#fff}
.plat-zhihu{background:rgba(0,102,255,0.85);color:#fff}
.plat-all{background:rgba(234,243,222,0.5);color:var(--olive-dd)}
/* 英语学习 */
.en-card{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(217,223,200,0.2)}
.en-card:last-child{border-bottom:none}
.en-card .en-text{flex:1}
.en-card .en-en{font-size:14px;font-weight:600;color:var(--ink);transition:opacity .2s}
.en-card .en-zh{font-size:12.5px;color:var(--muted);margin-top:2px;transition:opacity .2s}
.en-card.learned .en-en,.en-card.learned .en-zh{opacity:.35;text-decoration:line-through}
/* 每日灵感 */
.insp-card{display:flex;gap:12px;align-items:flex-start}
.insp-card .insp-time{flex-shrink:0;width:52px;text-align:center;background:rgba(94,122,58,0.12);backdrop-filter:blur(4px);border-radius:10px;padding:8px 4px;border:1px solid rgba(94,122,58,0.15)}
.insp-card .insp-time .t-label{font-size:10px;color:var(--muted);font-weight:600}
.insp-card .insp-time .t-val{font-size:13px;font-weight:700;color:var(--olive-dd);margin-top:2px}
.insp-card .insp-body{flex:1}
.insp-card .insp-theme{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
.insp-card .insp-content{font-size:12.5px;color:var(--muted);line-height:1.5}
/* AI资讯 */
.ainews-num{flex-shrink:0;width:28px;height:28px;border-radius:9px;background:rgba(94,122,58,0.15);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--olive-dd);border:1px solid rgba(94,122,58,0.2)}
.ainews-plain{font-size:13px;color:#3a3f30;line-height:1.55;margin-top:6px}
.ainews-why{font-size:12px;color:var(--olive-dd);background:rgba(234,243,222,0.4);border-radius:8px;padding:7px 10px;margin-top:8px;backdrop-filter:blur(4px);border-left:3px solid var(--olive)}
</style>
</head>

const KEY="xiaoye_data_v1";
function loadData(){
  let d={
    plan:{date:"",items:[]},
    planDefaults:DEFAULT_PLAN_TASKS.slice(),
    memo:[],
    reading:[],
    englishProgress:{date:"",checked:[]},
    profile:Object.assign({},DEFAULT_PROFILE),
    settings:{gistId:"8c01ff2a49e05adee2dec497028cdb8a",gistToken:"",kimiKey:""},
    content:null, contentAt:0
  };
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||"{}");
    if(s.plan)d.plan=s.plan;
    if(s.planDefaults&&s.planDefaults.length)d.planDefaults=s.planDefaults;
    if(s.memo)d.memo=s.memo;
    if(s.reading)d.reading=s.reading;
    if(s.englishProgress)d.englishProgress=s.englishProgress;
    if(s.profile)d.profile=Object.assign(d.profile,s.profile);
    if(s.settings)d.settings=Object.assign(d.settings,s.settings);
    if(s.content)d.content=s.content;
    if(s.contentAt)d.contentAt=s.contentAt;
  }catch(e){}
  if(!d.memo.length)d.memo=Array.from({length:5},()=>({id:rid(),text:"",done:false}));
  return d;
}

/* ============ 每日计划（固定5项 + 可增删） ============ */
function ensurePlanToday(){
  /* 日期变化 或 今日items为空 → 重新填入默认任务 */
  if(DATA.plan.date!==todayStr()||!DATA.plan.items||!DATA.plan.items.length){
    DATA.plan={date:todayStr(),items:DATA.planDefaults.map(t=>({text:t,done:false}))};
    saveData();
  }
}
function renderPlan(){
  ensurePlanToday();
  const items=DATA.plan.items;
  const done=items.filter(i=>i.done).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  let h=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">今日计划 · ${DATA.plan.date.slice(5)}</h3>
      <span class="badge">${done}/${items.length}</span>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="mini">${pct}% 完成 · 每天自动填入默认任务</div>
  </div>`;
  if(!items.length)h+=`<div class="empty"><div class="big">\u2713</div>今天还没安排，点右下角＋添加</div>`;
  items.forEach((it,i)=>{
    h+=`<div class="card task ${it.done?'done':''}" style="margin-bottom:8px">
      <div class="checkbox ${it.done?'on':''}" onclick="togglePlan(${i})">${it.done?'\u2713':''}</div>
      <div class="txt">${esc(it.text)}</div>
      <div class="del" onclick="delPlan(${i})">\u00D7</div>
    </div>`;
  });
  return h;
}
function togglePlan(i){DATA.plan.items[i].done=!DATA.plan.items[i].done;saveData();render();}
function delPlan(i){DATA.plan.items.splice(i,1);saveData();render();}
function onFab(){

    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="addPlan()">添加</button>

  else if(currentPage==="memo")openSheet("新建备忘",`
    <label>内容</label>
    <textarea id="m1" rows="2"></textarea>
    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="addMemo()">添加</button>

}

/* ============ 读书 ============ */
function renderReading(){
  let h=`<div class="card"><h3>读书</h3><div class="mini">记录在读进度，自动算已读天数</div></div>`;
  h+=`<div class="card" style="display:flex;align-items:center;gap:12px">
    <div style="font-size:30px">\u{1F4D6}</div>
    <div style="flex:1">
      <h3 style="margin:0">微信读书</h3>
      <div class="mini">一键打开微信读书APP，继续阅读</div>
    </div>
    <button class="btn btn-primary" onclick="launchWeRead()">打开</button>
  </div>`;
  if(!DATA.reading.length)h+=`<div class="empty"><div class="big">\u{1F4DA}</div>还没有在读书，点右下角＋添加</div>`;
  DATA.reading.forEach((b,i)=>{
    const pct=b.total?Math.min(100,Math.round(b.current/b.total*100)):0;
    const today=new Date();today.setHours(0,0,0,0);
    const start=new Date(b.start);start.setHours(0,0,0,0);
    const days=Math.max(0,Math.round((today-start)/86400000))+1;
    let finishDays=b.finish?Math.max(1,Math.round((new Date(b.finish)-start)/86400000)+1):null;
    h+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <h3 style="margin:0;flex:1">${esc(b.name)}</h3>
        <span class="del" onclick="delReading(${i})">\u00D7</span>
      </div>
      <div class="kv"><span>总页数</span><span class="v">${b.total}</span></div>
      <div class="kv"><span>在读页</span><span class="v">${b.current}（${pct}%）</span></div>
      <div class="kv"><span>开始日期</span><span class="v">${b.start}</span></div>
      <div class="kv"><span>已读天数</span><span class="v">${days} 天</span></div>
      ${finishDays?`<div class="kv"><span>读完用时</span><span class="v">${finishDays} 天</span></div>`:""}
      <div class="progress" style="margin-top:8px"><i style="width:${pct}%"></i></div>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-ghost btn-sm" onclick="updReadingPage(${i},-10)">-10页</button>
        <button class="btn btn-ghost btn-sm" onclick="updReadingPage(${i},10)">+10页</button>
        <button class="btn btn-line btn-sm" onclick="openUpdPage(${i})">改页数</button>
        ${b.finish?"":`<button class="btn btn-primary btn-sm" onclick="finishReading(${i})">读完</button>`}
      </div>
    </div>`;
  });
  return h;
}
function renderReadingForm(){
  return `<label>书名</label><input id="b_name" placeholder="例如：如何阅读一本书">
  <div class="row">
    <div><label>总页数</label><input id="b_total" type="number" inputmode="numeric" placeholder="320"></div>
    <div><label>在读页</label><input id="b_current" type="number" inputmode="numeric" placeholder="1"></div>
  </div>
  <label>开始读日期</label><input id="b_start" type="date" value="${todayStr()}">

function addReading(){
  const b={id:rid(),name:val("b_name"),total:+val("b_total")||0,current:+val("b_current")||1,start:val("b_start")||todayStr(),finish:""};

}
function updReadingPage(i,d){DATA.reading[i].current=Math.max(0,Math.min(DATA.reading[i].total,DATA.reading[i].current+d));saveData();render();}
function openUpdPage(i){const b=DATA.reading[i];openSheet("修改页数",`<label>当前读到第几页</label><input id="u_page" type="number" value="${b.current}"><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="saveUpdPage(${i})">保存</button>`);}
function saveUpdPage(i){DATA.reading[i].current=Math.max(0,Math.min(DATA.reading[i].total,+val("u_page")||0));saveData();closeSheet();render();toast("已保存");}
function finishReading(i){DATA.reading[i].finish=todayStr();if(!DATA.reading[i].current)DATA.reading[i].current=DATA.reading[i].total;saveData();render();toast("恭喜读完！");}
function delReading(i){DATA.reading.splice(i,1);saveData();render();}
function launchWeRead(){
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile){
    const t=Date.now();const ifr=document.createElement('iframe');ifr.style.display='none';ifr.src='weread://';document.body.appendChild(ifr);

    setTimeout(()=>{if(Date.now()-t<2000)window.open('https://weread.qq.com/','_blank');},900);
  }else{window.open('https://weread.qq.com/','_blank');}
}

/* ============ Gist 读取/同步 ============ */
async function fetchContent(show){
  const id=DATA.settings.gistId.trim();
  if(!id){if(show)toast("先在设置里填 Gist ID");return;}
  if(show)toast("正在拉取…");
  try{
    const r=await fetch("https://api.github.com/gists/"+id,{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok)throw new Error(r.status);
    const g=await r.json();
    let json=null;
    for(const fn in g.files){if(fn.endsWith('content.json')||fn==='content.json'){json=g.files[fn].content;break;}}
    if(!json&&g.files['content.json'])json=g.files['content.json'].content;
    if(!json){if(show)toast("Gist里没找到 content.json");return;}
    const obj=JSON.parse(json);
    DATA.content=obj;DATA.contentAt=Date.now();saveData();
    render();toast("已更新 · "+(obj.viralVideos?obj.viralVideos.length:0)+"条爆款视频");
  }catch(e){if(show)toast("拉取失败："+e.message);}
}
async function syncData(){
  const s=DATA.settings;
  if(!s.gistId.trim()||!s.gistToken.trim()){toast("请先在设置页填写 Gist ID + Token");openSettings();return;}
  toast("双向同步中…");
  try{
    /* 1. 拉取云端数据 */
    let cloudData=null,cloudProfile=null;
    const gr=await fetch("https://api.github.com/gists/"+s.gistId.trim(),{headers:{'Authorization':'Bearer '+s.gistToken.trim(),'Accept':'application/vnd.github+json'}});
    if(gr.ok){
      const g=await gr.json();
      if(g.files['data.json']){try{cloudData=JSON.parse(g.files['data.json'].content);}catch(e){}}
      if(g.files['profile.json']){try{cloudProfile=JSON.parse(g.files['profile.json'].content);}catch(e){}}
    }
    /* 2. 合并云端→本地 */
    if(cloudData){
      /* plan 按日期合并：云端+本地所有日期都保留，同一天取云端的（另一设备更新过） */
      if(cloudData.plan&&Array.isArray(cloudData.plan)){
        const cloudByDate={};cloudData.plan.forEach(p=>{if(p.date)cloudByDate[p.date]=p;});
        const localDates=DATA.plan.map(p=>p.date);
        DATA.plan=DATA.plan.map(p=>cloudByDate[p.date]?cloudByDate[p.date]:p);
        cloudData.plan.forEach(p=>{if(p.date&&!localDates.includes(p.date))DATA.plan.push(p);});
      }
      if(cloudData.memo)DATA.memo=cloudData.memo;
      if(cloudData.reading)DATA.reading=cloudData.reading;
      if(cloudData.planDefaults)DATA.planDefaults=cloudData.planDefaults;
    }
    if(cloudProfile)DATA.profile=cloudProfile;
    saveData();render();
    /* 3. 上传合并后的本地数据到云端 */
    const payload={files:{
      "data.json":{content:JSON.stringify({plan:DATA.plan,memo:DATA.memo,reading:DATA.reading,planDefaults:DATA.planDefaults},null,2)},
      "profile.json":{content:JSON.stringify(DATA.profile,null,2)}
    }};
    const r=await fetch("https://api.github.com/gists/"+s.gistId.trim(),{method:"PATCH",headers:{'Authorization':'Bearer '+s.gistToken.trim(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error(r.status);
    toast("双向同步完成 ✓（计划/备忘/读书/画像）");
  }catch(e){toast("同步失败："+e.message);}
}

/* ============ 深链唤起 ============ */
function launch(app,kw){
  kw=(kw||"教育 校园 一年级").trim();
  const map={
    douyin:{scheme:'snssdk1128://',web:'https://www.douyin.com/search/'+encodeURIComponent(kw)},
    bilibili:{scheme:'bilibili://',web:'https://search.bilibili.com/all?keyword='+encodeURIComponent(kw)},
    xhs:{scheme:'xhsdiscover://',web:'https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(kw)},
    zhihu:{scheme:'',web:'https://www.zhihu.com/search?type=content&q='+encodeURIComponent(kw)}
  };
  const c=map[app];const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile&&c.scheme){
    const t=Date.now();const ifr=document.createElement('iframe');ifr.style.display='none';ifr.src=c.scheme;document.body.appendChild(ifr);
    setTimeout(()=>{try{document.body.removeChild(ifr);}catch(e){}},300);
    setTimeout(()=>{if(Date.now()-t<2000)window.open(c.web,'_blank');},900);
  }else{window.open(c.web,'_blank');}
}

function openSheet(title,body){document.getElementById("sheetTitle").textContent=title;document.getElementById("sheetBody").innerHTML=body;document.getElementById("sheet").classList.add("open");}
