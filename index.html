}

      <li>左侧"API Key 管理"→新建一个 Key，复制</li>
      <li>在上面"Kimi API Key"框粘贴保存（定时生成也用它）</li>
    </ol>
    <div class="sec-title" style="margin:6px 0"><h2 style="font-size:13px">② 注册 GitHub + 建 Gist</h2></div>
    <ol class="steps">
      <li>github.com/signup 注册账号（5分钟）</li>
      <li>告诉我你的 GitHub 用户名，我带你建仓库和 Gist、配定时任务</li>
      <li>把 Gist ID 填到上面，选题/二创就接通了</li>
    </ol>
    <div class="note">这两步做好后，"每天8:00/14:00自动抓热榜+AI生成"就全自动了。我会在你注册后把定时任务文件给你。</div>
  </div>`;
}
function saveSettings(){DATA.settings.gistId=val("s_gist").trim();DATA.settings.gistToken=val("s_token").trim();DATA.settings.kimiKey=val("s_kimi").trim();saveData();toast("已保存");}
function exportData(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="xiaoye-backup-"+todayStr()+".json";a.click();toast("已导出备份");}
function importData(f){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);Object.assign(DATA,s);saveData();render();toast("已导入");}catch(e){toast("文件格式错误")}};r.readAsText(f.files[0]);}

/* ============ Gist 读取/同步 ============ */
async function fetchContent(show){
  const id=DATA.settings.gistId.trim();
  if(!id){if(show)toast("先在设置里填 Gist ID");return;}
  if(show)toast("正在拉取…");
  try{
    const r=await fetch("https://api.github.com/gists/"+id,{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok)throw new Error(r.status);
    const g=await r.json();
    let json=null;
    for(const fn in g.files){if(fn.endsWith('content.json')||fn==='content.json'){json=g.files[fn].content;break;}}
    if(!json&&g.files['content.json'])json=g.files['content.json'].content;
    if(!json){if(show)toast("Gist里没找到 content.json");return;}
    const obj=JSON.parse(json);
    DATA.content=obj;DATA.contentAt=Date.now();saveData();
    render();toast("已更新 · "+(obj.inspirations?obj.inspirations.length:0)+"选题");
  }catch(e){if(show)toast("拉取失败："+e.message);}
}
async function syncData(){
  const s=DATA.settings;
  if(!s.gistId.trim()||!s.gistToken.trim()){toast("同步需填 Gist ID + Token");return;}
  toast("上传同步中…");
  const payload={files:{"data.json":{content:JSON.stringify({plan:DATA.plan,memo:DATA.memo,reading:DATA.reading,review:DATA.review},null,2)}}};
  try{
    const r=await fetch("https://api.github.com/gists/"+s.gistId.trim(),{method:"PATCH",headers:{'Authorization':'Bearer '+s.gistToken.trim(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error(r.status);
    toast("已同步到云端 ✓");
  }catch(e){toast("同步失败："+e.message);}
}
async function pullSync(){
  const s=DATA.settings;
  if(!s.gistId.trim()){toast("先填 Gist ID");return;}
  try{
    const r=await fetch("https://api.github.com/gists/"+s.gistId.trim(),{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok)throw new Error(r.status);
    const g=await r.json();
    const f=g.files['data.json'];
    if(!f){toast("云端暂无个人数据");return;}
    const obj=JSON.parse(f.content);
    if(obj.plan)DATA.plan=obj.plan;
    if(obj.memo)DATA.memo=obj.memo;
    if(obj.reading)DATA.reading=obj.reading;
    if(obj.review)DATA.review=obj.review;
    saveData();render();toast("已从云端拉取 ✓");
  }catch(e){toast("拉取失败："+e.message);}
}

/* ============ 深链唤起 ============ */
function launch(app,kw){
  kw=(kw||"教育 校园 一年级").trim();
  const map={
    douyin:{scheme:'snssdk1128://',web:'https://www.douyin.com/search/'+encodeURIComponent(kw)},
    bilibili:{scheme:'bilibili://',web:'https://search.bilibili.com/all?keyword='+encodeURIComponent(kw)},
    xhs:{scheme:'xhsdiscover://',web:'https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(kw)}
  };
  const c=map[app];const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile){
    const t=Date.now();const ifr=document.createElement('iframe');ifr.style.display='none';ifr.src=c.scheme;document.body.appendChild(ifr);
    setTimeout(()=>{try{document.body.removeChild(ifr);}catch(e){}},300);
    setTimeout(()=>{if(Date.now()-t<2000)window.open(c.web,'_blank');},900);
  }else{window.open(c.web,'_blank');}
}

/* ============ 通用 UI ============ */
function toggleDrawer(o){document.getElementById("drawer").classList.toggle("open",o);document.getElementById("overlay").classList.toggle("open",o);}
function openSheet(title,body){document.getElementById("sheetTitle").textContent=title;document.getElementById("sheetBody").innerHTML=body;document.getElementById("sheet").classList.add("open");}
function closeSheet(){document.getElementById("sheet").classList.remove("open");}
let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}

/* ============ 启动 ============ */
renderNav();go("plan");
if(DATA.settings.gistId)fetchContent(false);
</script>
