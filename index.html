<style>
:root{
  --olive:#5E7A3A; --olive-d:#3B6D11; --olive-dd:#27500A; --olive-l:#EAF3DE; --olive-ll:#F4F7EE;
  --ink:#2E3326; --muted:#6B7355; --line:#D9DFC8; --card:#FFFFFF; --bg:#F4F6EE;
  --danger:#B23A3A; --warn:#C98A2E; --shadow:0 1px 3px rgba(40,50,20,.08),0 2px 8px rgba(40,50,20,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#E8ECDF;color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden;box-shadow:0 0 24px rgba(0,0,0,.06)}
.header{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--olive);color:#fff;box-shadow:0 2px 6px rgba(59,109,17,.18)}
.header .menu-btn{width:38px;height:38px;border:none;background:transparent;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer}
.header .menu-btn:active{background:rgba(255,255,255,.15)}
.header h1{flex:1;font-size:17px;font-weight:600;margin:0;letter-spacing:.5px}
.header .icon-btn{width:38px;height:38px;border:none;background:transparent;color:#fff;font-size:18px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.header .icon-btn:active{background:rgba(255,255,255,.15)}
.drawer-overlay{position:fixed;inset:0;background:rgba(20,28,10,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:264px;max-width:80vw;background:var(--olive-d);color:#fff;z-index:60;transform:translateX(-105%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px 18px 16px;background:var(--olive-dd)}
.drawer-head .avatar{width:46px;height:46px;border-radius:14px;background:var(--olive);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin-bottom:8px}
.drawer-head .name{font-size:16px;font-weight:600}
.drawer-head .sub{font-size:11.5px;opacity:.78;margin-top:2px}
.drawer nav{flex:1;padding:8px 0;overflow-y:auto}
.drawer .nav-item{display:flex;align-items:center;gap:12px;padding:13px 18px;font-size:14.5px;cursor:pointer;border-left:3px solid transparent}
.drawer .nav-item:active{background:rgba(255,255,255,.07)}
.drawer .nav-item.active{background:rgba(255,255,255,.12);border-left-color:#C0DD97;font-weight:600}
.drawer .nav-item .ic{font-size:17px;width:22px;text-align:center}
.drawer .sep{height:1px;background:rgba(255,255,255,.12);margin:8px 18px}
.drawer .foot{padding:12px 18px;font-size:11px;opacity:.6}
.main{padding:12px 12px 28px}
.page{display:none;animation:fade .2s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14.5px;font-weight:600;color:var(--olive-dd)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 8px}
.sec-title h2{font-size:14px;font-weight:600;color:var(--olive-dd);margin:0}
.sec-title .hint{font-size:11.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--olive);color:#fff}
.btn-primary:active{filter:brightness(.93)}
.btn-ghost{background:var(--olive-l);color:var(--olive-dd)}
.btn-line{background:#fff;color:var(--olive-d);border:1px solid var(--line)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #E6C4C4}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(94,122,58,.12)}
label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin:8px 0 4px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.tag{display:inline-block;background:var(--olive-l);color:var(--olive-dd);border-radius:6px;padding:2px 7px;font-size:11px;margin:2px 4px 2px 0;font-weight:600}
.progress{height:8px;background:var(--olive-ll);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),#7C9B4E);border-radius:6px;transition:width .3s}
.checkbox{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:#fff;font-size:13px;background:#fff}
.checkbox.on{background:var(--olive);border-color:var(--olive)}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--olive-ll)}
.task:last-child{border-bottom:none}
.task .txt{flex:1;font-size:13.5px}
.task.done .txt{color:var(--muted);text-decoration:line-through}
.task .del{color:var(--muted);font-size:16px;cursor:pointer;width:24px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--olive-l);color:var(--olive-dd);border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:600}
.badge.warn{background:#FBF3E6;color:var(--warn)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:13px}
.empty .big{font-size:34px;margin-bottom:6px;opacity:.5}
.platform-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.platform-btns .btn{flex:1;min-width:0;padding:8px 6px;font-size:12px}
.p-douyin{background:#fff;color:#1a1a1a;border:1px solid #eee}
.p-bili{background:#fff;color:#00A1D6;border:1px solid #d6edf6}
.p-xhs{background:#fff;color:#FF2442;border:1px solid #fbdde2}
.mini{font-size:11.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .v{font-weight:600;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:rgba(40,46,28,.94);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:70;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s;max-width:480px;margin:0 auto}
.sheet.open{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:18px 18px 0 0}
.sheet-head h3{margin:0;font-size:15px}
.sheet-body{padding:16px}
.note{background:var(--olive-ll);border-left:3px solid var(--olive);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--olive-dd);margin:8px 0}
.fab{position:fixed;right:16px;bottom:24px;width:52px;height:52px;border-radius:50%;background:var(--olive);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(59,109,17,.4);cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center}
@media(min-width:520px){.fab{right:calc(50% - 240px + 16px)}}
.plat-tag{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.plat-douyin{background:#000;color:#fff}
.plat-bili{background:#FB7299;color:#fff}
.plat-xhs{background:#FF2442;color:#fff}
.plat-all{background:var(--olive-l);color:var(--olive-dd)}
.en-card{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--olive-ll)}
.en-card:last-child{border-bottom:none}
.en-card .en-text{flex:1}
.en-card .en-en{font-size:14px;font-weight:600;color:var(--ink)}
.en-card .en-zh{font-size:12.5px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="app">

<div class="toast" id="toast"></div>

<script>
/* ============ 默认创作画像（可在设置中编辑，同步后生效） ============ */
const DEFAULT_PROFILE = {
  name:"沈知野", id:"shenzhiye3399",
  platform:"抖音（未来小红书）", track:"教育校园",
  audience:"28-45岁、负责孩子学习与家庭采买的妈妈",

  style:"灵动、有活人感、真实、长相甜美；目前以学习干活分享为主，未来加亲子日常与家庭教育口播",
  monetization:"带货（视频/直播：生活/日化/美妆/学习类）、接广、心理咨询/陪跑",
  keywords:["一年级","数学思维","英语启蒙","陪孩子写作业","背单词","计算","识字","亲子日常","家庭教育"],
  homepage:"https://v.douyin.com/TiKProte9YI/"
};

/* 每日计划默认任务 */
const DEFAULT_PLAN_TASKS = ["读书半小时","背单词","保健品","写文稿","陪孩子学习"];

/* 爆款视频占位（未接Gist时展示） */
const SEED_VIRAL = [
  {title:"一年级数学期末复习清单",keywords:["一年级","数学","期末"],content:"把这一学期常错的5类题做成清单，告诉妈妈怎么带娃过一遍。",platform:"抖音",viralReason:"痛点精准+可落地，妈妈群体高收藏。"},
  {title:"英语启蒙零基础磨耳朵3个免费资源",keywords:["英语启蒙","磨耳朵"],content:"盘点真正好用的免费磨耳朵资源，解决妈妈不知道用什么开始的痛点。",platform:"小红书",viralReason:"资源合集类收藏率高，零成本降低门槛。"},
  {title:"陪写作业不发火的3个开关",keywords:["陪写作业","情绪管理"],content:"分享情绪管理小技巧，妈妈亲测有效，亲子关系不崩。",platform:"抖音",viralReason:"高共鸣+可落地，评论区容易引发讨论。"},
  {title:"背单词不痛苦的滚雪球法",keywords:["背单词","记忆法"],content:"用艾宾浩斯+游戏化，让孩子主动想背，不是被逼。",platform:"B站",viralReason:"方法论+反常识，完播率高。"},
  {title:"100以内计算的3个卡点",keywords:["计算","数学思维"],content:"进退位、凑十破十、连加连减，逐个拆解怎么练。",platform:"抖音",viralReason:"垂直干货，搜索长效流量。"}
];
const SEED_RECREATIONS = [
  {hot:"某条『辅导作业崩溃』热门视频", angle:"反转：把崩溃变成3步平静辅导法", reason:"原视频情绪共鸣强但没解法，你的IP正好补上可落地的解法。", script:"开头复刻真实崩溃场景→转折『后来我换了3个开关』→逐步演示→结尾呼应亲子关系好的人设。"},
  {hot:"『英语启蒙千万别太早』争议帖", angle:"用我家的弯路现身说法", reason:"争议选题自带流量，你有走弯路的真实经历，可信度高。", script:"开头一句话观点→讲我家一年半弯路→给出判断标准→结尾给免费资源引导关注。"},
  {hot:"『乘法口诀背不下来』求助热榜", angle:"两周背熟节奏法实操演示", reason:"精准命中你已有爆款方向，搜索流量持续。", script:"钩子『别掰手指了』→展示两周节奏表→家长跟练→结尾送口诀表引导互动。"},
  {hot:"『一年级到底要不要上辅导班』讨论", angle:"妈妈视角的算账+选择框架", reason:"教育决策类选题，妈妈群体最关心，易引发评论和转发。", script:"开头抛问题→3个判断维度→我家怎么选的→结尾『你家呢』引导评论。"},
  {hot:"『写作业磨蹭』共鸣视频", angle:"不吼不叫的3个开关实操", reason:"高共鸣+可落地，强化你『亲子关系好又负责』的IP反差。", script:"复刻磨蹭场景→开关1/2/3演示→效果对比→结尾人设升华。"}
];
const SEED_ENGLISH = [
  {en:"Let's do our homework together.", zh:"我们一起做作业吧。"},
  {en:"Time for bed! Sweet dreams.", zh:"该睡觉了！做个好梦。"},
  {en:"Can you help me set the table?", zh:"你能帮我摆碗筷吗？"},
  {en:"Great job! I'm so proud of you.", zh:"太棒了！我为你骄傲。"},
  {en:"Let's read a story before sleep.", zh:"睡前我们读个故事吧。"}
];

/* ============ 导航 ============ */
const NAV=[
  {id:"plan",name:"每日计划",ic:"\u2713"},
  {id:"viral",name:"爆款视频",ic:"\u{1F525}"},
  {id:"recreate",name:"爆款热点二创",ic:"\u{1F4A5}"},
  {id:"english",name:"英语学习",ic:"\u{1F4D6}"},
  {id:"memo",name:"备忘录",ic:"\u270E"},
  {id:"reading",name:"读书",ic:"\u{1F4D6}"},
  {id:"settings",name:"设置",ic:"\u2699"}
];
let currentPage="plan";

/* ============ 数据层 ============ */
const KEY="xiaoye_data_v1";
function loadData(){
  let d={
    plan:{date:"",items:[]},
    planDefaults:DEFAULT_PLAN_TASKS.slice(),
    memo:[],
    reading:[],
    englishProgress:{date:"",checked:[]},
    profile:Object.assign({},DEFAULT_PROFILE),
    settings:{gistId:"8c01ff2a49e05adee2dec497028cdb8a",gistToken:"",kimiKey:""},
    content:null, contentAt:0
  };
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||"{}");
    if(s.plan)d.plan=s.plan;
    if(s.planDefaults)d.planDefaults=s.planDefaults;
    if(s.memo)d.memo=s.memo;
    if(s.reading)d.reading=s.reading;
    if(s.englishProgress)d.englishProgress=s.englishProgress;
    if(s.profile)d.profile=Object.assign(d.profile,s.profile);
    if(s.settings)d.settings=Object.assign(d.settings,s.settings);
    if(s.content)d.content=s.content;
    if(s.contentAt)d.contentAt=s.contentAt;
  }catch(e){}
  if(!d.memo.length)d.memo=Array.from({length:5},()=>({id:rid(),text:"",done:false}));
  return d;
}
function saveData(){localStorage.setItem(KEY,JSON.stringify(DATA));}
let DATA=loadData();
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ============ 渲染入口 ============ */
function renderNav(){
  document.getElementById("nav").innerHTML=NAV.map(n=>
    `<div class="nav-item ${n.id===currentPage?'active':''}" onclick="go('${n.id}')"><span class="ic">${n.ic}</span>${n.name}</div>`
  ).join("");
}
function go(id){
  currentPage=id;
  document.getElementById("pageTitle").textContent=NAV.find(n=>n.id===id).name;
  renderNav();
  toggleDrawer(false);
  render();
  document.getElementById("fab").style.display=(id==="plan"||id==="memo"||id==="reading")?"flex":"none";
}
function render(){
  const main=document.getElementById("main");
  if(currentPage==="plan")main.innerHTML=renderPlan();
  else if(currentPage==="viral")main.innerHTML=renderViral();
  else if(currentPage==="recreate")main.innerHTML=renderRecreate();
  else if(currentPage==="english")main.innerHTML=renderEnglish();
  else if(currentPage==="memo")main.innerHTML=renderMemo();
  else if(currentPage==="reading")main.innerHTML=renderReading();
  else if(currentPage==="settings")main.innerHTML=renderSettings();
  main.className="main";
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function val(id){return (document.getElementById(id)||{}).value||"";}

/* ============ 每日计划（固定5项 + 可增删） ============ */
function ensurePlanToday(){
  if(DATA.plan.date!==todayStr()){
    DATA.plan={date:todayStr(),items:DATA.planDefaults.map(t=>({text:t,done:false}))};
    saveData();
  }
}
function renderPlan(){
  ensurePlanToday();
  const items=DATA.plan.items;
  const done=items.filter(i=>i.done).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  let h=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">

/* ============ 读书 ============ */
function renderReading(){
  let h=`<div class="card"><h3>读书</h3><div class="mini">记录在读进度，自动算已读天数</div></div>`;
  if(!DATA.reading.length)h+=`<div class="empty"><div class="big">\u{1F4D6}</div>还没有在读书，点右下角＋添加</div>`;
  DATA.reading.forEach((b,i)=>{
    const pct=b.total?Math.min(100,Math.round(b.current/b.total*100)):0;
    const today=new Date();today.setHours(0,0,0,0);
    const start=new Date(b.start);start.setHours(0,0,0,0);
    const days=Math.max(0,Math.round((today-start)/86400000))+1;
    let finishDays=b.finish?Math.max(1,Math.round((new Date(b.finish)-start)/86400000)+1):null;
    h+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <h3 style="margin:0;flex:1">${esc(b.name)}</h3>
        <span class="del" onclick="delReading(${i})">\u00D7</span>
      </div>
      <div class="kv"><span>总页数</span><span class="v">${b.total}</span></div>
      <div class="kv"><span>在读页</span><span class="v">${b.current}（${pct}%）</span></div>
      <div class="kv"><span>开始日期</span><span class="v">${b.start}</span></div>
      <div class="kv"><span>已读天数</span><span class="v">${days} 天</span></div>
      ${finishDays?`<div class="kv"><span>读完用时</span><span class="v">${finishDays} 天</span></div>`:""}
      <div class="progress" style="margin-top:8px"><i style="width:${pct}%"></i></div>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-ghost btn-sm" onclick="updReadingPage(${i},-10)">-10页</button>
        <button class="btn btn-ghost btn-sm" onclick="updReadingPage(${i},10)">+10页</button>
        <button class="btn btn-line btn-sm" onclick="openUpdPage(${i})">改页数</button>
        ${b.finish?"":`<button class="btn btn-primary btn-sm" onclick="finishReading(${i})">读完</button>`}
      </div>
    </div>`;
  });
  return h;
}

/* ============ Gist 读取/同步 ============ */
async function fetchContent(show){
  const id=DATA.settings.gistId.trim();
  if(!id){if(show)toast("先在设置里填 Gist ID");return;}
  if(show)toast("正在拉取…");
  try{
    const r=await fetch("https://api.github.com/gists/"+id,{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok)throw new Error(r.status);
    const g=await r.json();
    let json=null;
    for(const fn in g.files){if(fn.endsWith('content.json')||fn==='content.json'){json=g.files[fn].content;break;}}
    if(!json&&g.files['content.json'])json=g.files['content.json'].content;
    if(!json){if(show)toast("Gist里没找到 content.json");return;}
    const obj=JSON.parse(json);
    DATA.content=obj;DATA.contentAt=Date.now();saveData();
    render();toast("已更新 · "+(obj.viralVideos?obj.viralVideos.length:0)+"条爆款视频");
  }catch(e){if(show)toast("拉取失败："+e.message);}
}
async function syncData(){
  const s=DATA.settings;
  if(!s.gistId.trim()||!s.gistToken.trim()){toast("同步需填 Gist ID + Token（在设置里）");return;}
  toast("上传同步中…");
  const payload={files:{
    "data.json":{content:JSON.stringify({plan:DATA.plan,memo:DATA.memo,reading:DATA.reading,planDefaults:DATA.planDefaults},null,2)},
    "profile.json":{content:JSON.stringify(DATA.profile,null,2)}
  }};
  try{
    const r=await fetch("https://api.github.com/gists/"+s.gistId.trim(),{method:"PATCH",headers:{'Authorization':'Bearer '+s.gistToken.trim(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error(r.status);
    toast("已同步到云端（含画像） ✓");
  }catch(e){toast("同步失败："+e.message);}
}

/* ============ 深链唤起 ============ */
function launch(app,kw){
  kw=(kw||"教育 校园 一年级").trim();
  const map={
    douyin:{scheme:'snssdk1128://',web:'https://www.douyin.com/search/'+encodeURIComponent(kw)},
    bilibili:{scheme:'bilibili://',web:'https://search.bilibili.com/all?keyword='+encodeURIComponent(kw)},
    xhs:{scheme:'xhsdiscover://',web:'https://www.xiaohongshu.com/search_result?keyword='+encodeURIComponent(kw)}
  };
  const c=map[app];const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile){
    const t=Date.now();const ifr=document.createElement('iframe');ifr.style.display='none';ifr.src=c.scheme;document.body.appendChild(ifr);
    setTimeout(()=>{try{document.body.removeChild(ifr);}catch(e){}},300);
    setTimeout(()=>{if(Date.now()-t<2000)window.open(c.web,'_blank');},900);
  }else{window.open(c.web,'_blank');}
}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}
